name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo_sqlite
          coverage: none
      - name: Validate tag and plugin versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/check-release-metadata.sh "$RELEASE_TAG"
      - name: Prepare WordPress source for native table tests
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-6.8.3.tar.gz --output "$RUNNER_TEMP/wordpress.tar.gz"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"
          echo "WP_ADMIN_TEST_ROOT=$RUNNER_TEMP/wordpress" >> "$GITHUB_ENV"
      - name: Lint plugin PHP
        run: |
          composer validate --no-check-publish --no-interaction
          composer lint
          composer test:language-clone
          composer test:frontend-visibility
          composer test:runtime-integrity
          composer test:relational-labels
          composer test:content-import
      - name: Build and validate ZIP
        env:
          CFFP_SKIP_SYNC: '1'
        run: bash scripts/build-release-zip.sh "$RUNNER_TEMP/custom-fields-framework-pro.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${RELEASE_TAG#v}" '
            $0 == "= " version " =" { active = 1; next }
            active && /^=/ { exit }
            active { print }
          ' readme.txt > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/custom-fields-framework-pro.zip" \
            --verify-tag --latest --title "Custom Fields Framework Pro $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
