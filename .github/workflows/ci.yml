name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --no-check-publish --no-interaction
      - run: composer lint

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate release package
        env:
          CFFP_SKIP_SYNC: '1'
        run: bash scripts/build-release-zip.sh "$RUNNER_TEMP/custom-fields-framework-pro.zip"
