name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Prepare WordPress source for native table tests
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-6.8.3.tar.gz --output "$RUNNER_TEMP/wordpress.tar.gz"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"
          echo "WP_ADMIN_TEST_ROOT=$RUNNER_TEMP/wordpress" >> "$GITHUB_ENV"
      - run: composer validate --no-check-publish --no-interaction
      - run: composer lint
      - run: composer test:language-clone
      - run: composer test:frontend-visibility
      - run: composer test:runtime-integrity
      - run: composer test:relational-labels
      - run: composer test:content-import

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate release package
        env:
          CFFP_SKIP_SYNC: '1'
        run: bash scripts/build-release-zip.sh "$RUNNER_TEMP/custom-fields-framework-pro.zip"
